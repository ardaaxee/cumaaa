<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ config.background_color }}">
  <meta name="robots" content="noindex">
  <title>{{ config.page_title }}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

  <!-- config.json'daki renkler. Degerler app.py'de hex/renk-adi olarak
       dogrulaniyor; blok CSP nonce'u ile calisiyor. -->
  <style nonce="{{ csp_nonce }}">
    :root {
      --heart-1: {{ config.heart_color }};
      --heart-2: {{ config.secondary_color }};
      --bg-1: {{ config.background_color }};
    }
  </style>
</head>
<body>
  <main class="heart-stage">
    <svg id="heart" class="heart" viewBox="0 0 32 29.6"
         role="img" aria-label="Kalp" tabindex="0">
      <defs>
        <!-- Renkler style.css icinde config degerleriyle eziliyor;
             buradakiler yalnizca yedek. -->
        <linearGradient id="heartFill" x1="15%" y1="0%" x2="85%" y2="100%">
          <stop class="stop-light" offset="0%" stop-color="#ff9dbb"/>
          <stop class="stop-main" offset="52%" stop-color="#ff3d73"/>
          <stop class="stop-deep" offset="100%" stop-color="#b3123f"/>
        </linearGradient>
        <radialGradient id="heartShine" cx="30%" cy="24%" r="45%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path class="heart__path"
            d="M23.6 0c-3.4 0-6.3 2.1-7.6 5.1C14.7 2.1 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"
            fill="url(#heartFill)"/>
      <path class="heart__shine"
            d="M23.6 0c-3.4 0-6.3 2.1-7.6 5.1C14.7 2.1 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"
            fill="url(#heartShine)"/>
    </svg>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
