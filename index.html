<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<!-- Mobil-öncelikli görünüm + iOS/Android safe-area -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#000000" />
<meta name="description" content="ARDA — digital profile. Kişisel dijital alan." />
<meta name="color-scheme" content="dark" />

<!-- Open Graph (Instagram/paylaşım önizlemesi) -->
<meta property="og:title" content="ARDA · Digital Profile" />
<meta property="og:description" content="Kişisel dijital alan — 2026" />
<meta property="og:type" content="website" />

<title>ARDA · Digital Profile</title>

<link rel="stylesheet" href="static/css/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' fill='%23e8ecff' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
</head>

<body>
  <!-- İmleci/dokunuşu takip eden yumuşak ışık -->
  <div id="light" aria-hidden="true"></div>
  <!-- Çok hafif ambient parçacık arka planı (eski özellikten korundu) -->
  <canvas id="ambient" aria-hidden="true"></canvas>
  <!-- Grain/noise dokusu -->
  <div id="grain" aria-hidden="true"></div>

  <!-- Scroll ilerleme çubuğu -->
  <div id="scrollbar" aria-hidden="true"><span id="scrollbar-fill"></span></div>

  <!-- Açılış perdesi (boot) -->
  <div id="boot" aria-hidden="true">
    <div class="boot-line" id="boot-text">ARDA.OS</div>
  </div>

  <!-- Üst bar -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-name">ARDA</span>
      <span class="brand-sub" id="brand-sub">DIGITAL PROFILE / 2026</span>
    </div>
    <button id="share-toggle" class="icon-btn" aria-label="Paylaş" aria-haspopup="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
    </button>
  </header>

  <!-- Sağdaki bölüm navigasyonu (discover ilerleme) -->
  <nav id="dots" aria-label="Bölümler"></nav>

  <!-- ANA İÇERİK — bölümler JS ile doldurulur -->
  <main id="app">

    <!-- 01 PROFILE -->
    <section class="section" id="sec-profile" data-index="01" data-name="PROFILE">
      <div class="reveal profile-head">
        <div class="avatar" id="avatar" role="img" aria-label="Avatar"></div>
        <h1 class="hero-name" id="hero-name">ARDA</h1>
        <div class="hero-label" id="hero-label">DIGITAL PROFILE / 2026</div>
      </div>
      <div class="reveal status-row" id="status-row"></div>
      <p class="reveal bio" id="bio"></p>
      <div class="reveal meta-grid" id="meta-grid"></div>
      <div class="reveal links" id="links"></div>
    </section>

    <!-- 02 MUSIC -->
    <section class="section" id="sec-music" data-index="02" data-name="MUSIC">
      <div class="reveal section-title"><span class="idx">02</span> MUSIC</div>
      <div class="reveal now-playing" id="now-playing"></div>
    </section>

    <!-- 03 PROJECTS -->
    <section class="section" id="sec-projects" data-index="03" data-name="PROJECTS">
      <div class="reveal section-title"><span class="idx">03</span> PROJECTS</div>
      <div class="projects-grid" id="projects-grid"></div>
    </section>

    <!-- 04 TERMUX -->
    <section class="section" id="sec-termux" data-index="04" data-name="TERMUX">
      <div class="reveal section-title"><span class="idx">04</span> TERMUX LAB</div>
      <p class="reveal termux-intro" id="termux-intro"></p>
      <div class="termux-grid" id="termux-grid"></div>
    </section>

    <!-- 05 LAB / DIGITAL SPACE -->
    <section class="section" id="sec-lab" data-index="05" data-name="LAB">
      <div class="reveal section-title"><span class="idx">05</span> DIGITAL SPACE</div>
      <div class="reveal lab-card" id="lab-card"></div>
    </section>

    <!-- 06 CONNECT -->
    <section class="section" id="sec-connect" data-index="06" data-name="CONNECT">
      <div class="reveal section-title"><span class="idx">06</span> CONNECT</div>
      <p class="reveal contact-intro" id="contact-intro"></p>
      <form class="reveal contact-form" id="contact-form" novalidate>
        <!-- Honeypot (botlar için gizli) -->
        <input type="text" name="website" id="hp-website" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <label class="field">
          <span>İSİM</span>
          <input type="text" name="name" id="c-name" maxlength="80" autocomplete="name" required />
        </label>
        <label class="field">
          <span>E-POSTA</span>
          <input type="email" name="email" id="c-email" maxlength="120" autocomplete="email" required />
        </label>
        <label class="field">
          <span>MESAJ</span>
          <textarea name="message" id="c-message" rows="4" maxlength="2000" required></textarea>
        </label>
        <button type="submit" class="submit-btn" id="c-submit">GÖNDER</button>
        <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
      </form>
      <div class="reveal share-row" id="share-row"></div>
      <footer class="foot">
        <span id="foot-handle">@arda</span>
        <span class="foot-dot">·</span>
        <span>ARDA.OS 2026</span>
      </footer>
    </section>

  </main>

  <!-- Fullscreen detay katmanı (proje detayı / termux lab) -->
  <div id="overlay" aria-hidden="true">
    <div id="overlay-inner"></div>
    <button id="overlay-close" class="icon-btn" aria-label="Kapat">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <!-- Paylaş sayfası (copy / share / QR) -->
  <div id="share-sheet" aria-hidden="true">
    <div class="sheet-panel">
      <div class="sheet-grip"></div>
      <div class="sheet-title">PAYLAŞ</div>
      <button class="sheet-btn" id="btn-copy"><span>Bağlantıyı kopyala</span><em id="copy-state"></em></button>
      <button class="sheet-btn" id="btn-share"><span>Paylaş</span></button>
      <button class="sheet-btn" id="btn-qr"><span>QR kod</span></button>
      <div id="qr-wrap" hidden><div id="qr-box"></div><div class="qr-url" id="qr-url"></div></div>
    </div>
  </div>

  <!-- Küçük sistem toast -->
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- İçerik verisi (fetch başarısızsa fallback) -->
  <script src="static/js/data.js"></script>
  <!-- Çevrimdışı QR üreticisi (MIT, repoya gömülü) -->
  <script src="static/js/qrcode.min.js"></script>
  <script src="static/js/app.js"></script>
</body>
</html>
