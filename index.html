<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ardaaxe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08080c;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: min(90%, 430px);
      padding: 45px 25px;
      border-radius: 28px;
      background: #111118;
      box-shadow: 0 20px 70px rgba(0,0,0,.6);
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      font-size: 30px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      color: #999;
      margin-bottom: 30px;
    }

    a {
      display: block;
      padding: 16px;
      margin: 12px 0;
      border-radius: 15px;
      background: #1d1d27;
      color: white;
      text-decoration: none;
      transition: .2s;
    }

    a:hover {
      transform: translateY(-2px);
      background: #292936;
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="avatar">A</div>

    <h1>ardaaxe</h1>

    <p>Digital space · projects · social</p>

    <a href="https://instagram.com/lov4ardaa" target="_blank">
      Instagram
    </a>

    <a href="cikti/profil.md">
      Profil
    </a>

    <a href="cikti/takvim.md">
      Takvim
    </a>

  </main>

</body>
</html>
