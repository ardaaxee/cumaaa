name: YKS Quality

on:
  push:
    branches:
      - "claude/yks-study-platform-p15aod"
    paths:
      - "yks/**"
      - ".github/workflows/yks-quality.yml"
  pull_request:
    paths:
      - "yks/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yks/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Release regression tests
        run: npm run test:release

      - name: Build
        run: npm run build

      - name: Verify offline build
        run: npm run check:build

      - name: Browser acceptance tests
        run: npm run e2e

      - name: Release files and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iyi-ki-yks-3.1-${{ github.sha }}
          path: |
            yks/dist/
            yks/artifacts/
          retention-days: 14
