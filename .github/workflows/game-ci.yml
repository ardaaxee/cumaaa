name: CUMA WORLD game CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/game-ci.yml'

permissions:
  contents: read

jobs:
  verify-game:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
