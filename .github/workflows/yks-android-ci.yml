name: YKS Android Native

on:
  push:
    branches:
      - claude/yks-study-platform-p15aod
    paths:
      - 'yks-android/**'
      - '.github/workflows/yks-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yks-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK + release bundle
        working-directory: yks-android
        env:
          ORG_GRADLE_PROJECT_TURN_URL: ${{ secrets.TURN_URL }}
          ORG_GRADLE_PROJECT_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          ORG_GRADLE_PROJECT_TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: |
          export YKS_LIVE_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          export YKS_LIVE_VERSION_NAME="1.1.${GITHUB_RUN_NUMBER}"
          gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yks-live-android-debug
          path: yks-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # İmza anahtarı depoda/Actions'ta tutulmaz: imzasız paket ayrı dala yazılır, sabit anahtarla yerelde imzalanır
      # (her sürüm aynı anahtarla imzalandığı için telefondaki uygulama silinmeden güncellenir).
      - name: Publish unsigned bundle to yks-android-dist branch
        run: |
          mkdir -p "$RUNNER_TEMP/dist" && cp yks-android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/yks-canli-unsigned.aab"
          cd "$RUNNER_TEMP/dist"
          git init -q -b yks-android-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Kaynak: ${GITHUB_SHA} · sürüm 1.1.${GITHUB_RUN_NUMBER} (versionCode $((100 + GITHUB_RUN_NUMBER)))" > README.txt
          git add . && git commit -qm "İmzasız YKS Canlı paketi ${GITHUB_SHA::7} (#${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:yks-android-dist
