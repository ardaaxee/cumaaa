name: YKS Android Native

on:
  push:
    branches:
      - claude/yks-study-platform-p15aod
    paths:
      - 'yks-android/**'
      - '.github/workflows/yks-android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yks-android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        working-directory: yks-android
        env:
          ORG_GRADLE_PROJECT_TURN_URL: ${{ secrets.TURN_URL }}
          ORG_GRADLE_PROJECT_TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          ORG_GRADLE_PROJECT_TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yks-live-android-debug
          path: yks-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
