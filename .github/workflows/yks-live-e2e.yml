name: YKS Canlı uçtan uca

# Canlı ekran paylaşımını gerçek ağ üzerinden dener:
#  - web: iki tarayıcı gerçek Supabase odasında (doğrudan WebRTC + yedek yol)
#  - android: emülatördeki YKS Canlı uygulaması ↔ tarayıcı, iki yönde
on:
  push:
    branches:
      - claude/yks-study-platform-p15aod
    paths:
      - 'yks/src/pages/LiveTogetherPage.tsx'
      - 'yks/src/utils/liveRelay.ts'
      - 'yks/scripts/e2e-live.mjs'
      - 'yks/scripts/live-*.mjs'
      - 'yks-android/**'
      - '.github/workflows/yks-live-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yks-live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: yks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yks/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - name: Canlı paylaşım (gerçek Supabase)
        run: npm run e2e:live

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yks/package-lock.json
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK (x86_64 emülatör için tüm ABI'ler)
        working-directory: yks-android
        run: gradle :app:assembleDebug -PYKS_ALL_ABIS=true --stacktrace
      - name: Build web app
        working-directory: yks
        run: |
          npm ci
          npm run build
          npx playwright-core install --with-deps chromium
      - name: Emülatörde canlı paylaşım
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash yks-android/scripts/emulator-live-test.sh
      - name: Günlükler
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yks-live-android-logs
          path: live-test-logs
          if-no-files-found: ignore
