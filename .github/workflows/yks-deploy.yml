name: Deploy YKS to GitHub Pages

on:
  push:
    branches:
      - "claude/yks-study-platform-p15aod"
    paths:
      - "yks/**"
      - ".github/workflows/yks-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-yks-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yks/package-lock.json

      - name: Install
        working-directory: yks
        run: npm ci

      - name: Build
        working-directory: yks
        run: npm run build

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # Eski /assets dosyaları SİLİNMEZ (açık kalmış eski sekmeler güncellemede kırılmasın);
      # index.html ile yeni paketler aynı commit'te yayına girer, birleşik klasör yeniden doğrulanır.
      - name: Add YKS build (keep old assets)
        run: |
          mkdir -p gh-pages/yks/assets
          cp -R yks/dist/assets/. gh-pages/yks/assets/
          find yks/dist -maxdepth 1 -type f -exec cp {} gh-pages/yks/ \;
          for d in yks/dist/*/; do [ "$(basename "$d")" = "assets" ] || cp -R "$d" gh-pages/yks/; done
          touch gh-pages/.nojekyll
          node yks/scripts/check-build.mjs gh-pages/yks

      - name: Publish
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yks .nojekyll
          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi
          git commit -m "deploy: latest YKS site (${GITHUB_SHA::7})"
          for i in 1 2 3 4; do
            if git push origin HEAD:gh-pages; then exit 0; fi
            git pull --rebase origin gh-pages
            sleep $((2 ** i))
          done
          exit 1
