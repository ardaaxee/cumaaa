name: Deploy YKS to GitHub Pages

on:
  push:
    branches:
      - "claude/yks-study-platform-p15aod"
    paths:
      - "yks/**"
      - ".github/workflows/yks-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-yks-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yks/package-lock.json

      - name: Install
        working-directory: yks
        run: npm ci

      - name: Verify release
        working-directory: yks
        run: npm run verify

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Replace YKS build
        run: |
          mkdir -p gh-pages/yks
          # Keep hashed assets used by tabs that are still running the previous version.
          cp -R yks/dist/. gh-pages/yks/
          touch gh-pages/.nojekyll

      - name: Publish
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yks .nojekyll
          if git diff --cached --quiet; then
            echo "No deployment changes."
            exit 0
          fi
          git commit -m "deploy: latest YKS site"
          if ! git push origin gh-pages; then
            echo "gh-pages changed during deploy; reapplying the build to the latest branch."
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            mkdir -p yks
            cp -R "$GITHUB_WORKSPACE/yks/dist/." yks/
            touch .nojekyll
            git add yks .nojekyll
            if ! git diff --cached --quiet; then
              git commit -m "deploy: latest YKS site"
              git push origin gh-pages
            fi
          fi
