name: YKS Google Play paketi

# Play Store'a yüklenecek imzalı .aab (ve telefona doğrudan kurulabilen imzalı .apk) üretir.
# İmza anahtarı depoda değildir; Actions secrets'tan alınır:
#   YKS_UPLOAD_KEYSTORE_BASE64, YKS_UPLOAD_KEYSTORE_PASSWORD
on:
  push:
    branches:
      - claude/yks-study-platform-p15aod
    paths:
      - 'yks-play/**'
      - '.github/workflows/yks-play.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yks-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore upload key
        env:
          KEYSTORE_B64: ${{ secrets.YKS_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::YKS_UPLOAD_KEYSTORE_BASE64 secret yok; imzasız .aab üretilecek (jarsigner ile sonradan imzalanır)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "YKS_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build signed AAB + APK
        working-directory: yks-play
        env:
          YKS_KEYSTORE_PASSWORD: ${{ secrets.YKS_UPLOAD_KEYSTORE_PASSWORD }}
          YKS_KEY_ALIAS: upload
          YKS_VERSION_CODE: ${{ github.run_number }}
          YKS_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:bundleRelease :app:assembleRelease --stacktrace
      - name: Verify signature
        if: env.YKS_KEYSTORE_FILE != ''
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs yks-play/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"
      - name: Upload Play bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: iyiki-yks-play-aab
          path: yks-play/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload installable APK
        if: env.YKS_KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: iyiki-yks-apk
          path: yks-play/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      # İmza anahtarı Actions'ta yoksa: imzasız paket ayrı bir dala yazılır, imzalama yerelde (jarsigner) yapılır.
      - name: Publish unsigned bundle to yks-play-dist branch
        if: env.YKS_KEYSTORE_FILE == ''
        run: |
          mkdir -p "$RUNNER_TEMP/dist" && cp yks-play/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/dist/iyiki-yks-unsigned.aab"
          cd "$RUNNER_TEMP/dist"
          git init -q -b yks-play-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Kaynak: ${GITHUB_SHA} · sürüm 1.0.${GITHUB_RUN_NUMBER} (versionCode ${GITHUB_RUN_NUMBER})" > README.txt
          git add . && git commit -qm "İmzasız Play paketi ${GITHUB_SHA::7} (#${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:yks-play-dist
