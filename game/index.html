<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070b" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070a0f'/%3E%3Cpath d='M11 9h10v3h-7v8h7v3H11z' fill='%23ffc98a'/%3E%3C/svg%3E"
    />
    <title>CUMA WORLD</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="captureFrame" aria-hidden="true"></div>

    <div id="hud">
      <div class="region">
        CUMA WORLD
        <b>ASTER CITY</b>
        <small>MERIDIAN MARKET · NIGHT · RAIN</small>
      </div>
      <div class="status">
        <div id="objective">Meridian Market</div>
        <div id="cameraMode">SHOULDER R</div>
      </div>
      <div id="boss" class="hidden">
        <b>THE GLASS WARDEN</b>
        <div class="meter"><i id="hp"></i></div>
        <div class="meter posture"><i id="posture"></i></div>
        <small>PHASE <span id="phase">1</span></small>
      </div>
      <div id="nameCard" class="hidden">
        <span class="rank">MERIDIAN · WARDEN CLASS</span>
        <b>THE GLASS WARDEN</b>
      </div>
      <div id="playerVitals" class="hidden"><i id="playerHealth"></i></div>
      <div id="damageFlash"></div>
      <div id="regionReveal" class="hidden">
        <span class="city">ASTER CITY</span>
        <b id="regionName"></b>
      </div>
      <div id="msg"></div>
    </div>

    <button id="cine" type="button" title="9:16 capture (C)">CINE</button>
    <button id="shoulder" type="button" title="Camera mode (V)">CAM</button>
    <button id="map" type="button" title="Map (M)">MAP</button>

    <div id="mapPanel" class="hidden">
      <h2>ASTER CITY</h2>
      <!-- Filled from what the player has actually seen. -->
      <ul id="mapRegions"></ul>
      <p class="mapHint">Unvisited districts appear as you find them.</p>
    </div>

    <div id="controls">
      <div id="joy"><span></span></div>
      <div id="look"></div>
      <div class="buttons">
        <button data-action="jump" type="button">✕</button>
        <button data-action="dodge" type="button">○</button>
        <button data-action="action" type="button">□</button>
        <button data-action="focus" type="button">△</button>
        <button data-action="parry" type="button">L1</button>
        <button data-action="action" type="button">R1</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
