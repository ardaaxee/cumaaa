# Render.com tek tıkla kurulum (Blueprint, ücretsiz plan): yapay zekâ asistanı sunucusu.
# Render panelinde "New → Blueprint" ile bu depoyu seçin; GEMINI_API_KEY değerini
# (Google AI Studio'dan ücretsiz) yalnızca Render panelindeki ortam değişkenine girin.
# İsterseniz ücretli Claude için sonradan ANTHROPIC_API_KEY de ekleyebilirsiniz.
services:
  - type: web
    name: iyiki-yks
    runtime: node
    rootDir: yks
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://ardaaxee.github.io
      - key: NODE_VERSION
        value: "22"
